[server]
headless = true
port = 8501

[client]
toolbarMode = "minimal"

[theme]
# Dark base — dataframes, upload widgets, selects all inherit dark automatically
base                     = "dark"
primaryColor             = "#D94035"       # Nova red (brightened for dark backgrounds)
backgroundColor          = "#111827"
secondaryBackgroundColor = "#1F2937"
textColor                = "#F3F4F6"
font                     = "sans serif"
